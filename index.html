<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>הלו"ז של הילדים</title>
  <meta name="theme-color" content="#1450b4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231450b4'/%3E%3Ccircle cx='32' cy='33' r='17' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M32 24v10l7 5' stroke='%23fff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- שער: קוד משפחתי -->
  <div id="gate" hidden>
    <div class="gate-logo" aria-hidden="true"></div>
    <h1 class="gate-title">הלו"ז של הילדים</h1>
    <p class="gate-sub">כדי לפתוח צריך את הקוד המשפחתי. הוא נמצא בקישור ששלח ניר.</p>
    <form id="gate-form">
      <input id="gate-code" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="קוד משפחתי" placeholder="קוד">
      <p class="gate-err" id="gate-err" hidden>הקוד לא נכון. נסו שוב.</p>
      <button class="gate-cta" type="submit">לפתוח</button>
    </form>
  </div>

  <div id="app" hidden>
    <div class="sticky-stack">
      <header class="topbar">
        <div class="logo" aria-hidden="true"></div>
        <div class="titles">
          <h1>הלו"ז של הילדים</h1>
          <div class="sub" id="top-sub"></div>
        </div>
        <div class="clocks" id="clocks"></div>
      </header>
      <div class="ticker" id="ticker" hidden><div class="ticker-track" id="ticker-track"></div></div>
      <nav class="days" id="days" aria-label="ימים"></nav>
    </div>

    <section class="now-banner" id="now-banner" hidden></section>

    <div class="timeline" id="timeline"></div>

    <section class="panel" id="phones"></section>
    <section class="panel" id="notes"></section>

    <a class="edit-link" id="edit-link" target="_blank" rel="noopener">✏️ לשנות או להוסיף משהו: בטבלה בגוגל שיטס</a>
    <div class="sync-note" id="sync-note" role="button" tabindex="0"></div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="detail-sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-label="פרטים"></div>

  <script src="app.js"></script>
</body>
</html>
